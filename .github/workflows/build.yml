name: Desktop build verification
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  development:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:desktop
      - run: npm run package:dev
      - run: node scripts/verify-package.cjs release-dev
      - uses: actions/upload-artifact@v4
        with:
          name: development-${{ matrix.os }}
          path: release-dev/
